# Build the browser editions and publish them to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# The site gets <meta name="robots" content="noindex"> (shared with friends, kept out of search results).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          JIZURA_BASE: ${{ steps.pages.outputs.base_url }}/
          JIZURA_NOINDEX: '1'
          JIZURA_OUT: _site
        run: |
          python build.py
          # downloads linked from the app / README (AE panels), plus the license notices
          cp LICENSE THIRD_PARTY_NOTICES.md JIZURA_AE.jsx JIZURA_AE_en.jsx JIZURA_CEP.zip JIZURA_CEP_en.zip _site/
          rm -f _site/sitemap.xml   # not advertised to search engines
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
